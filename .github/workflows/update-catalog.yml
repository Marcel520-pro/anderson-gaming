name: Mise à jour du catalogue

on:
  schedule:
    - cron: '0 3 * * *'   # chaque nuit à 03:00 UTC
  workflow_dispatch:       # lancement manuel possible

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer games.json depuis RAWG
        run: node scripts/fetch-games.mjs
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
      - name: Commit si le catalogue a changé
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/assets/games.json
          git diff --cached --quiet || (git commit -m "chore: mise à jour du catalogue" && git push)
